<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>විෂයානුබද්ධ වාග්මාලාව</title>
<style>
  :root{
    --paper:#EFE9DC;
    --paper-raised:#F7F3E9;
    --ink:#26221A;
    --ink-soft:#5B564A;
    --line:#D9D1BE;
    --maroon:#7A2E2E;
    --maroon-dark:#5E2222;
    --brass:#A9822C;
    --sage:#5C6E52;
    --draft:#6B6455;
    --danger:#9A3324;
    --card-shadow: 0 1px 0 rgba(38,34,26,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family: Georgia, "Noto Serif Sinhala", "Iskoola Pota", serif;
    line-height:1.5;
    min-height:100vh;
  }
  .ui{font-family: -apple-system, "Segoe UI", "Noto Sans Sinhala", "Iskoola Pota", sans-serif;}

  #app{max-width:920px; margin:0 auto; padding:28px 20px 80px;}

  header.top{
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  header.top h1{
    margin:0;
    font-size:28px;
    font-weight:700;
    letter-spacing:0.2px;
  }
  header.top .sub{
    font-family: -apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:4px;
  }

  nav.tabs{
    display:flex;
    gap:2px;
    font-family: -apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;
  }
  nav.tabs button{
    background:transparent;
    border:1px solid var(--ink);
    border-bottom:none;
    padding:9px 18px;
    font-size:14px;
    cursor:pointer;
    color:var(--ink);
    border-radius:6px 6px 0 0;
    position:relative;
    top:1px;
  }
  nav.tabs button.active{
    background:var(--paper-raised);
    font-weight:700;
    border-bottom:1px solid var(--paper-raised);
  }
  nav.tabs button:not(.active):hover{ background:rgba(38,34,26,0.05); }

  section.view{display:none;}
  section.view.active{display:block;}

  /* ---------- shared controls ---------- */
  .field{ margin-bottom:14px; }
  .field label{
    display:block; font-family:-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;
    font-size:12.5px; color:var(--ink-soft); margin-bottom:5px;
  }
  .field input[type=text], .field input[type=search], .field textarea, .field select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    background:#fff;
    font-family:-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;
    font-size:14.5px;
    color:var(--ink);
    border-radius:4px;
  }
  .field textarea{ min-height:70px; resize:vertical; }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:2px solid var(--brass); outline-offset:0; border-color:var(--brass);
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px){ .row2{grid-template-columns:1fr;} }

  button.btn{
    font-family:-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;
    font-size:14px;
    padding:9px 16px;
    border-radius:5px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper-raised);
    cursor:pointer;
  }
  button.btn:hover{ background:#3a3527; }
  button.btn.secondary{ background:transparent; color:var(--ink); }
  button.btn.secondary:hover{ background:rgba(38,34,26,0.06); }
  button.btn.danger{ background:var(--danger); border-color:var(--danger); color:#fff; }
  button.btn.danger:hover{ background:#7d2a1c; }
  button.btn:disabled{ opacity:0.5; cursor:default; }
  button.link{
    background:none;border:none;padding:2px 6px;cursor:pointer;
    font-family:-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;
    font-size:13px; color:var(--maroon); text-decoration:underline;
  }

  .badge{
    display:inline-block; font-family:-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;
    font-size:11.5px; padding:2px 9px; border-radius:20px; border:1px solid currentColor;
  }
  .badge.published{ color:var(--sage); }
  .badge.draft{ color:var(--draft); }

  .banner{
    font-family:-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;
    font-size:13px; padding:10px 14px; border-radius:5px; margin-bottom:16px;
  }
  .banner.warn{ background:#F3E6D0; border:1px solid var(--brass); color:#5c4413; }
  .banner.error{ background:#F6E1DB; border:1px solid var(--danger); color:var(--maroon-dark); }
  .banner.ok{ background:#E8EDE4; border:1px solid var(--sage); color:#37452f; }

  /* ---------- Admin ---------- */
  .admin-toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
  .admin-toolbar input[type=search]{ flex:1; min-width:180px; }
  .admin-toolbar select{ width:auto; }

  form#entryForm{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-left:4px solid var(--maroon);
    border-radius:6px;
    padding:18px 20px;
    margin-bottom:26px;
  }
  form#entryForm h2{ font-size:16px; margin:0 0 14px; }
  .form-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:6px; }

  table.entries{
    width:100%; border-collapse:collapse;
    font-family:-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;
    font-size:14px;
  }
  table.entries th{
    text-align:left; font-weight:600; font-size:12px; color:var(--ink-soft);
    border-bottom:1px solid var(--ink); padding:8px 8px;
  }
  table.entries td{ border-bottom:1px solid var(--line); padding:10px 8px; vertical-align:top; }
  table.entries tr:hover td{ background:rgba(169,130,44,0.06); }
  .word-cell{ font-family:Georgia,"Noto Serif Sinhala",serif; font-weight:700; }
  .meaning-cell{ color:var(--ink-soft); max-width:260px; }
  .actions-cell{ white-space:nowrap; }

  details.settings{
    margin:0 0 20px; font-family:-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif; font-size:13px;
  }
  details.settings summary{ cursor:pointer; color:var(--ink-soft); }
  details.settings .box{
    margin-top:10px; padding:12px 14px; background:var(--paper-raised);
    border:1px solid var(--line); border-radius:6px;
  }
  details.settings code{
    display:block; background:#fff; border:1px solid var(--line); padding:8px;
    border-radius:4px; font-size:12px; white-space:pre-wrap; margin-top:6px;
  }

  .empty{
    text-align:center; padding:40px 10px; color:var(--ink-soft);
    font-family:-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif; font-size:14px;
  }

  /* ---------- Public ---------- */
  .public-controls{ margin-bottom:20px; }
  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .chip{
    font-family:-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;
    font-size:12.5px; padding:5px 13px; border-radius:20px; border:1px solid var(--line);
    background:#fff; cursor:pointer; color:var(--ink-soft);
  }
  .chip.active{ background:var(--ink); color:var(--paper-raised); border-color:var(--ink); }

  .card-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px){ .card-grid{grid-template-columns:1fr;} }

  .word-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-left:4px solid var(--brass);
    border-radius:6px;
    padding:16px 18px;
    box-shadow:var(--card-shadow);
  }
  .word-card .w{ font-size:19px; font-weight:700; margin:0 0 4px; }
  .word-card .cat{
    font-family:-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;
    font-size:11.5px; color:var(--brass); margin-bottom:8px; display:block;
  }
  .word-card .m{ font-size:14.5px; margin:0 0 6px; }
  .word-card .s{
    font-family:-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;
    font-size:13px; color:var(--ink-soft); margin:0 0 8px;
  }
  .word-card .alt{
    font-family:-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;
    font-size:12px; color:var(--ink-soft); margin-bottom:8px;
  }
  .word-card .src{
    font-family:-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;
    font-size:11.5px; color:var(--ink-soft); border-top:1px solid var(--line); padding-top:7px; margin-top:4px;
  }

  .loading{ text-align:center; padding:30px; color:var(--ink-soft); font-family:-apple-system,sans-serif; }

  /* ---------- Auth ---------- */
  .login-box{
    max-width:360px;
    margin:20px auto 40px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-left:4px solid var(--maroon);
    border-radius:6px;
    padding:22px 24px;
  }
  .login-box h2{ font-size:17px; margin:0 0 4px; }
  .login-box .hint{
    font-family:-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;
    font-size:12.5px; color:var(--ink-soft); margin:0 0 16px;
  }
  .login-box .form-actions{ justify-content:flex-start; margin-top:4px; }

  .session-bar{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; flex-wrap:wrap;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 16px;
    margin-bottom:18px;
    font-family:-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;
    font-size:13px;
    color:var(--ink-soft);
  }
  .session-bar b{ color:var(--ink); }
  .session-bar button{
    background:none; border:none; color:var(--maroon); text-decoration:underline;
    cursor:pointer; font-size:13px; font-family:inherit;
  }
  .word-card .author{
    font-family:-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;
    font-size:11.5px; color:var(--brass); text-align:right; margin:6px 0 0; font-style:italic;
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <h1>විෂයානුබද්ධ වාග්මාලාව</h1>
      <div class="sub">වචන හා දත්ත සමුදාය</div>
    </div>
    <nav class="tabs">
      <button class="ui" data-view="public" id="tabPublic">විෂයානුබද්ධ වාග්මාලාව</button>
      <button class="ui" data-view="admin" id="tabAdmin">පරිපාලනය</button>
    </nav>
  </header>

  <!-- ============ PUBLIC VIEW ============ -->
  <section class="view active" id="viewPublic">
    <div class="public-controls">
      <div class="field">
        <label class="ui" for="publicSearch">වචනයක් හෝ අර්ථයක් සොයන්න</label>
        <input class="ui" type="search" id="publicSearch" placeholder="උදා: ප්‍රඥාව">
      </div>
      <div class="chip-row" id="publicCategoryChips"></div>
    </div>
    <div id="publicList"><div class="loading ui">පූරණය වෙමින්...</div></div>
  </section>

  <!-- ============ ADMIN VIEW ============ -->
  <section class="view" id="viewAdmin">

    <div class="login-box" id="loginBox">
      <h2 class="ui">පරිපාලක පිවිසුම</h2>
      <p class="hint">ඔබේ author නමය සහ මුරපදය ඇතුළත් කරන්න.</p>
      <div id="loginBanner"></div>
      <form id="loginForm">
        <div class="field">
          <label class="ui" for="loginUsername">Author නම</label>
          <input class="ui" type="text" id="loginUsername" required autocomplete="username">
        </div>
        <div class="field">
          <label class="ui" for="loginPassword">මුරපදය</label>
          <input class="ui" type="password" id="loginPassword" required autocomplete="current-password">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn ui" id="loginBtn">ඇතුළු වන්න</button>
        </div>
      </form>
    </div>

    <div id="adminContent" style="display:none;">

    <div class="session-bar ui">
      <span>ලොග් වී ඇත්තේ <b id="sessionUser"></b> ලෙසිනි</span>
      <button type="button" id="logoutBtn">ඉවත් වන්න (Logout)</button>
    </div>

    <details class="settings">
      <summary>සැකසුම් (වගු නාම, ආදිය)</summary>
      <div class="box">
        <div class="field" style="margin-bottom:10px;">
          <label for="tableNameInput">Supabase වගු නාමය (words table)</label>
          <input type="text" id="tableNameInput" value="word_aliases">
        </div>
        <div class="field" style="margin-bottom:10px;">
          <label for="authTableNameInput">වගු නාමය</label>
          <input type="text" id="authTableNameInput" value="authors">
        </div>
        <button class="btn secondary ui" id="saveTableName" type="button">යාවත්කාලීන කර නැවත පූරණය කරන්න</button>
        <div id="altColNotice"></div>
        <div id="authorColNotice"></div>
      </div>
    </details>

    <div id="adminBanner"></div>

    <form id="entryForm">
      <h2 class="ui" id="formTitle">නව වචනයක් එකතු කරන්න</h2>
      <input type="hidden" id="editId">
      <div class="row2">
        <div class="field">
          <label class="ui" for="fWord">වචනය *</label>
          <input class="ui" type="text" id="fWord" required>
        </div>
        <div class="field">
          <label class="ui" for="fCategory">Category</label>
          <input class="ui" type="text" id="fCategory" list="categoryOptions" placeholder="උදා: සාමාන්‍ය">
          <datalist id="categoryOptions"></datalist>
        </div>
      </div>
      <div class="field">
        <label class="ui" for="fMeaning">අර්ථය *</label>
        <textarea class="ui" id="fMeaning" required></textarea>
      </div>
      <div class="field">
        <label class="ui" for="fSummary">විස්තරය / සාරාංශය</label>
        <textarea class="ui" id="fSummary"></textarea>
      </div>
      <div class="row2">
        <div class="field" id="altField">
          <label class="ui" for="fAlt">විකල්ප වචන (කොමා වලින් වෙන් කරන්න)</label>
          <input class="ui" type="text" id="fAlt" placeholder="උදා: වචන1, වචන2">
        </div>
        <div class="field">
          <label class="ui" for="fSource">Source</label>
          <input class="ui" type="text" id="fSource" placeholder="මූලාශ්‍රය">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label class="ui" for="fStatus">තත්ත්වය</label>
          <select class="ui" id="fStatus">
            <option value="draft">කෙටුම්පත (Draft)</option>
            <option value="published">ප්‍රකාශිත (Published)</option>
          </select>
        </div>
        <div class="field">
          <label class="ui">Author</label>
          <input class="ui" type="text" id="fAuthorDisplay" disabled>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn secondary ui" id="cancelEdit" style="display:none;">අවලංගු කරන්න</button>
        <button type="submit" class="btn ui" id="submitBtn">එකතු කරන්න</button>
      </div>
    </form>

    <div class="admin-toolbar">
      <input class="ui" type="search" id="adminSearch" placeholder="සොයන්න: වචනය හෝ අර්ථය...">
      <select class="ui" id="adminCategoryFilter"><option value="">සියලුම categories</option></select>
      <select class="ui" id="adminStatusFilter">
        <option value="">සියලුම තත්ත්ව</option>
        <option value="draft">කෙටුම්පත</option>
        <option value="published">ප්‍රකාශිත</option>
      </select>
      <button class="btn secondary ui" id="refreshBtn" type="button">නැවත පූරණය</button>
    </div>

    <div id="adminList"><div class="loading ui">පූරණය වෙමින්...</div></div>

    </div><!-- /adminContent -->
  </section>
</div>

<script>
(function(){
  const SUPABASE_URL = "https://uqgzlaxsnknheoerbfus.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxZ3psYXhzbmtuaGVvZXJiZnVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5MjM2MTUsImV4cCI6MjA3OTI4MzYxNX0.IYWZ7ukx8J-GJMWy7cMk2BWnmzJmJjjE93yEmJie7nQ";
  const REST_BASE = SUPABASE_URL + "/rest/v1/";

  let TABLE = "word_aliases";
  let AUTH_TABLE = "authors";
  let entries = [];
  let hasAltColumn = true;
  let hasAuthorColumn = true;
  let editingId = null;
  let currentUser = null; // { username, password }

  const $ = (id) => document.getElementById(id);

  function headers(extra){
    return Object.assign({
      "apikey": ANON_KEY,
      "Authorization": "Bearer " + ANON_KEY,
      "Content-Type": "application/json"
    }, extra || {});
  }

  async function sbGetFrom(table, query){
    const res = await fetch(REST_BASE + table + query, { headers: headers() });
    if(!res.ok){
      const body = await res.text();
      throw new Error(body || res.statusText);
    }
    return res.json();
  }

  async function sbGet(query){
    const res = await fetch(REST_BASE + TABLE + query, { headers: headers() });
    if(!res.ok){
      const body = await res.text();
      throw new Error(body || res.statusText);
    }
    return res.json();
  }

  async function sbWrite(method, body, filter){
    const res = await fetch(REST_BASE + TABLE + (filter || ""), {
      method,
      headers: headers({ "Prefer": "return=representation" }),
      body: body ? JSON.stringify(body) : undefined
    });
    const text = await res.text();
    let json = null;
    try { json = text ? JSON.parse(text) : null; } catch(e){ /* not json */ }
    if(!res.ok){
      const msg = (json && (json.message || json.hint)) || text || res.statusText;
      const err = new Error(msg);
      err.raw = json;
      throw err;
    }
    return json;
  }

  // ---------- table / column config ----------
  async function loadConfig(){
    try{
      const stored = await window.storage.get("config:table_name");
      if(stored && stored.value) TABLE = stored.value;
    }catch(e){ /* no stored value yet, keep default */ }
    try{
      const storedAuth = await window.storage.get("config:auth_table_name");
      if(storedAuth && storedAuth.value) AUTH_TABLE = storedAuth.value;
    }catch(e){ /* no stored value yet, keep default */ }
    $("tableNameInput").value = TABLE;
    $("authTableNameInput").value = AUTH_TABLE;
  }

  async function checkAltColumn(){
    try{
      await sbGet("?select=alternatives&limit=1");
      hasAltColumn = true;
      $("altColNotice").innerHTML = "";
    }catch(e){
      hasAltColumn = false;
      $("altColNotice").innerHTML =
        '<div class="banner warn" style="margin-top:10px;">' +
        '"alternatives" තීරුව මෙම වගුවේ නොමැත — විකල්ප වචන field එක අක්‍රිය කර ඇත. ' +
        'එය සක්‍රීය කිරීමට පහත SQL එක Supabase SQL Editor එකේ run කරන්න:' +
        '<code>ALTER TABLE ' + escapeHtml(TABLE) + ' ADD COLUMN alternatives text;</code></div>';
    }
    $("altField").style.display = hasAltColumn ? "" : "none";
  }

  async function checkAuthorColumn(){
    try{
      await sbGet("?select=author&limit=1");
      hasAuthorColumn = true;
      $("authorColNotice").innerHTML = "";
    }catch(e){
      hasAuthorColumn = false;
      $("authorColNotice").innerHTML =
        '<div class="banner warn" style="margin-top:10px;">' +
        '"author" තීරුව "' + escapeHtml(TABLE) + '" වගුවේ නොමැත — ඇතුළත් කරන entries සමඟ author නම save වන්නේ නැහැ. ' +
        'එය සක්‍රීය කිරීමට පහත SQL එක Supabase SQL Editor එකේ run කරන්න:' +
        '<code>ALTER TABLE ' + escapeHtml(TABLE) + ' ADD COLUMN author text;</code></div>';
    }
  }

  // ---------- auth ----------
  function showLoginBanner(message, type){
    const el = $("loginBanner");
    if(!message){ el.innerHTML = ""; return; }
    el.innerHTML = '<div class="banner ' + (type||"error") + ' ui">' + escapeHtml(message) + '</div>';
  }

  function showLoggedIn(){
    $("loginBox").style.display = "none";
    $("adminContent").style.display = "";
    $("sessionUser").textContent = currentUser.username;
    $("fAuthorDisplay").value = currentUser.username;
  }

  function showLoggedOut(){
    $("loginBox").style.display = "";
    $("adminContent").style.display = "none";
  }

  async function attemptLogin(username, password){
    const rows = await sbGetFrom(
      AUTH_TABLE,
      "?select=username,password&username=eq." + encodeURIComponent(username) + "&limit=1"
    );
    if(rows.length === 0 || String(rows[0].password) !== String(password)){
      throw new Error("පරිශීලක නාමය හෝ මුරපදය වැරදියි.");
    }
    return { username: rows[0].username, password: rows[0].password };
  }

  $("loginForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const username = $("loginUsername").value.trim();
    const password = $("loginPassword").value;
    if(!username || !password) return;
    showLoginBanner("", null);
    $("loginBtn").disabled = true;
    try{
      const user = await attemptLogin(username, password);
      currentUser = user;
      try{ await window.storage.set("auth:session", JSON.stringify(user)); }catch(e){ /* ignore */ }
      showLoggedIn();
      await loadEntries();
    }catch(e){
      showLoginBanner(e.message || "පිවිසීමට නොහැකි විය.", "error");
    }finally{
      $("loginBtn").disabled = false;
    }
  });

  $("logoutBtn").addEventListener("click", async () => {
    currentUser = null;
    try{ await window.storage.delete("auth:session"); }catch(e){ /* ignore */ }
    $("loginUsername").value = "";
    $("loginPassword").value = "";
    showLoggedOut();
  });

  async function tryRestoreSession(){
    try{
      const stored = await window.storage.get("auth:session");
      if(!stored || !stored.value) return false;
      const saved = JSON.parse(stored.value);
      const user = await attemptLogin(saved.username, saved.password);
      currentUser = user;
      showLoggedIn();
      return true;
    }catch(e){
      try{ await window.storage.delete("auth:session"); }catch(e2){ /* ignore */ }
      return false;
    }
  }

  // ---------- data loading ----------
  async function loadEntries(){
    $("adminList").innerHTML = '<div class="loading ui">පූරණය වෙමින්...</div>';
    $("publicList").innerHTML = '<div class="loading ui">පූරණය වෙමින්...</div>';
    try{
      entries = await sbGet("?select=*&order=created_at.desc&limit=2000");
      renderCategoryOptions();
      renderAdminList();
      renderPublicList();
      showBanner("adminBanner", "", null);
    }catch(e){
      const msg = 'දත්ත ලබාගැනීමට නොහැකි විය: ' + escapeHtml(e.message) +
        '. වගු නාමය "' + escapeHtml(TABLE) + '" නිවැරදිදැයි "සැකසුම්" හරහා පරීක්ෂා කරන්න.';
      $("adminList").innerHTML = '<div class="empty ui">' + msg + '</div>';
      $("publicList").innerHTML = '<div class="empty ui">' + msg + '</div>';
    }
  }

  function showBanner(elId, message, type){
    const el = $(elId);
    if(!message){ el.innerHTML = ""; return; }
    el.innerHTML = '<div class="banner ' + (type||"ok") + ' ui">' + escapeHtml(message) + '</div>';
    if(type !== "error"){
      setTimeout(()=>{ if(el.firstChild) el.innerHTML=""; }, 4000);
    }
  }

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function fmtDate(d){
    if(!d) return "";
    try{
      const dt = new Date(d);
      const pad = n => String(n).padStart(2,"0");
      return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate());
    }catch(e){ return d; }
  }

  // ---------- category helpers ----------
  function distinctCategories(list){
    const set = new Set();
    list.forEach(e => { if(e.category) set.add(e.category); });
    return Array.from(set).sort();
  }

  function renderCategoryOptions(){
    const cats = distinctCategories(entries);
    $("categoryOptions").innerHTML = cats.map(c => '<option value="'+escapeHtml(c)+'">').join("");

    const filterSel = $("adminCategoryFilter");
    const currentVal = filterSel.value;
    filterSel.innerHTML = '<option value="">සියලුම categories</option>' +
      cats.map(c => '<option value="'+escapeHtml(c)+'">'+escapeHtml(c)+'</option>').join("");
    filterSel.value = currentVal;
  }

  // ---------- ADMIN rendering ----------
  function filteredAdminEntries(){
    const q = $("adminSearch").value.trim().toLowerCase();
    const cat = $("adminCategoryFilter").value;
    const status = $("adminStatusFilter").value;
    return entries.filter(e => {
      // Only ever show entries created by the currently logged-in author.
      if(!currentUser || e.author !== currentUser.username) return false;
      if(cat && e.category !== cat) return false;
      if(status && e.status !== status) return false;
      if(q){
        const hay = ((e.word||"") + " " + (e.meaning||"") + " " + (e.summary||"")).toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function renderAdminList(){
    const list = filteredAdminEntries();
    if(list.length === 0){
      $("adminList").innerHTML = '<div class="empty ui">ඔබ විසින් තවම වචන එකතු කර නොමැත. නව වචනයක් එකතු කරන්න.</div>';
      return;
    }
    let html = '<table class="entries"><thead><tr>' +
      '<th>වචනය</th><th>අර්ථය</th><th>Category</th><th>තත්ත්වය</th><th>යාවත්කාලීන</th><th></th>' +
      '</tr></thead><tbody>';
    list.forEach(e => {
      html += '<tr>' +
        '<td class="word-cell">' + escapeHtml(e.word) + '</td>' +
        '<td class="meaning-cell">' + escapeHtml(truncate(e.meaning, 60)) + '</td>' +
        '<td class="ui">' + escapeHtml(e.category || "—") + '</td>' +
        '<td><span class="badge ' + (e.status==="published"?"published":"draft") + ' ui">' +
            (e.status==="published" ? "ප්‍රකාශිත" : "කෙටුම්පත") + '</span></td>' +
        '<td class="ui">' + fmtDate(e.updated_at || e.created_at) + '</td>' +
        '<td class="actions-cell ui">' +
          '<button class="link" data-action="edit" data-id="'+e.id+'">සංස්කරණය</button>' +
          '<button class="link" data-action="toggle" data-id="'+e.id+'">' +
             (e.status==="published" ? "Draft කරන්න" : "Publish කරන්න") + '</button>' +
          '<button class="link" data-action="delete" data-id="'+e.id+'" style="color:var(--danger);">මකන්න</button>' +
        '</td>' +
      '</tr>';
    });
    html += '</tbody></table>';
    $("adminList").innerHTML = html;
  }

  function truncate(s, n){
    s = s || "";
    return s.length > n ? s.slice(0,n) + "…" : s;
  }

  $("adminList").addEventListener("click", (ev) => {
    const btn = ev.target.closest("button[data-action]");
    if(!btn) return;
    const id = btn.getAttribute("data-id");
    const action = btn.getAttribute("data-action");
    const entry = entries.find(e => String(e.id) === String(id));
    // Guard: never allow an action on an entry that isn't this author's own,
    // even if the id somehow slipped through from elsewhere.
    if(!entry || !currentUser || entry.author !== currentUser.username) return;
    if(action === "edit") startEdit(entry);
    if(action === "delete") doDelete(entry);
    if(action === "toggle") doToggleStatus(entry);
  });

  ["adminSearch","adminCategoryFilter","adminStatusFilter"].forEach(id => {
    $(id).addEventListener("input", renderAdminList);
    $(id).addEventListener("change", renderAdminList);
  });

  $("refreshBtn").addEventListener("click", loadEntries);

  // ---------- form (create / edit) ----------
  function resetForm(){
    editingId = null;
    $("formTitle").textContent = "නව වචනයක් එකතු කරන්න";
    $("submitBtn").textContent = "එකතු කරන්න";
    $("cancelEdit").style.display = "none";
    $("editId").value = "";
    $("fWord").value = "";
    $("fCategory").value = "";
    $("fMeaning").value = "";
    $("fSummary").value = "";
    $("fAlt").value = "";
    $("fSource").value = "";
    $("fStatus").value = "draft";
    $("fAuthorDisplay").value = currentUser ? currentUser.username : "";
  }

  function startEdit(entry){
    editingId = entry.id;
    $("formTitle").textContent = '"' + entry.word + '" සංස්කරණය කරන්න';
    $("submitBtn").textContent = "යාවත්කාලීන කරන්න";
    $("cancelEdit").style.display = "";
    $("editId").value = entry.id;
    $("fWord").value = entry.word || "";
    $("fCategory").value = entry.category || "";
    $("fMeaning").value = entry.meaning || "";
    $("fSummary").value = entry.summary || "";
    $("fAlt").value = entry.alternatives || "";
    $("fSource").value = entry.source || "";
    $("fStatus").value = entry.status === "published" ? "published" : "draft";
    $("fAuthorDisplay").value = currentUser ? currentUser.username : (entry.author || "");
    $("entryForm").scrollIntoView({ behavior:"smooth", block:"start" });
  }

  $("cancelEdit").addEventListener("click", resetForm);

  $("entryForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const word = $("fWord").value.trim();
    const meaning = $("fMeaning").value.trim();
    if(!word || !meaning){ return; }

    const payload = {
      word,
      meaning,
      summary: $("fSummary").value.trim() || null,
      category: $("fCategory").value.trim() || null,
      source: $("fSource").value.trim() || null,
      status: $("fStatus").value,
      updated_at: new Date().toISOString()
    };
    if(hasAltColumn){
      payload.alternatives = $("fAlt").value.trim() || null;
    }
    if(hasAuthorColumn && currentUser){
      payload.author = currentUser.username;
    }

    // When editing, only ever allow updating an entry that belongs to the
    // logged-in author.
    if(editingId){
      const owned = entries.find(e => String(e.id) === String(editingId));
      if(!owned || !currentUser || owned.author !== currentUser.username){
        showBanner("adminBanner", "ඔබට මෙම ප්‍රවේශය සංස්කරණය කිරීමට අවසර නැත.", "error");
        return;
      }
    }

    const submitBtn = $("submitBtn");
    submitBtn.disabled = true;
    try{
      if(editingId){
        await sbWrite("PATCH", payload, "?id=eq." + encodeURIComponent(editingId));
        showBanner("adminBanner", "යාවත්කාලීන කරන ලදී.", "ok");
      } else {
        payload.created_at = new Date().toISOString();
        await sbWrite("POST", payload, "");
        showBanner("adminBanner", "නව වචනය එකතු කරන ලදී.", "ok");
      }
      resetForm();
      await loadEntries();
    }catch(e){
      showBanner("adminBanner", "සුරැකීමට නොහැකි විය: " + e.message, "error");
    }finally{
      submitBtn.disabled = false;
    }
  });

  async function doDelete(entry){
    if(!confirm('"' + entry.word + '" මකා දැමීමට විශ්වාසද?')) return;
    try{
      await sbWrite("DELETE", null, "?id=eq." + encodeURIComponent(entry.id));
      showBanner("adminBanner", "ප්‍රවේශය මකා දමන ලදී.", "ok");
      if(editingId === entry.id) resetForm();
      await loadEntries();
    }catch(e){
      showBanner("adminBanner", "මකා දැමීමට නොහැකි විය: " + e.message, "error");
    }
  }

  async function doToggleStatus(entry){
    const newStatus = entry.status === "published" ? "draft" : "published";
    try{
      await sbWrite("PATCH", { status:newStatus, updated_at:new Date().toISOString() },
        "?id=eq." + encodeURIComponent(entry.id));
      await loadEntries();
    }catch(e){
      showBanner("adminBanner", "තත්ත්වය වෙනස් කිරීමට නොහැකි විය: " + e.message, "error");
    }
  }

  // ---------- PUBLIC rendering ----------
  let activeCategory = "";

  function renderPublicCategoryChips(){
    const cats = distinctCategories(entries.filter(e => e.status === "published"));
    let html = '<button class="chip ui'+(activeCategory===""?" active":"")+'" data-cat="">සියල්ල</button>';
    cats.forEach(c => {
      html += '<button class="chip ui'+(activeCategory===c?" active":"")+'" data-cat="'+escapeHtml(c)+'">'+escapeHtml(c)+'</button>';
    });
    $("publicCategoryChips").innerHTML = html;
  }

  $("publicCategoryChips").addEventListener("click", (ev) => {
    const btn = ev.target.closest("button[data-cat]");
    if(!btn) return;
    activeCategory = btn.getAttribute("data-cat");
    renderPublicCategoryChips();
    renderPublicList();
  });

  $("publicSearch").addEventListener("input", renderPublicList);

  function renderPublicList(){
    renderPublicCategoryChips();
    const q = $("publicSearch").value.trim().toLowerCase();
    const list = entries.filter(e => {
      if(e.status !== "published") return false;
      if(activeCategory && e.category !== activeCategory) return false;
      if(q){
        const hay = ((e.word||"") + " " + (e.meaning||"") + " " + (e.summary||"")).toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    });
    if(list.length === 0){
      $("publicList").innerHTML = '<div class="empty ui">ගැලපෙන වචන හමු නොවීය.</div>';
      return;
    }
    let html = '<div class="card-grid">';
    list.forEach(e => {
      html += '<div class="word-card">';
      if(e.category) html += '<span class="cat">' + escapeHtml(e.category) + '</span>';
      html += '<p class="w">' + escapeHtml(e.word) + '</p>';
      html += '<p class="m">' + escapeHtml(e.meaning) + '</p>';
      if(e.summary) html += '<p class="s">' + escapeHtml(e.summary) + '</p>';
      if(e.alternatives) html += '<p class="alt">විකල්ප: ' + escapeHtml(e.alternatives) + '</p>';
      if(e.source) html += '<p class="src">මූලාශ්‍රය: ' + escapeHtml(e.source) + '</p>';
      if(e.author) html += '<p class="author">— ' + escapeHtml(e.author) + '</p>';
      html += '</div>';
    });
    html += '</div>';
    $("publicList").innerHTML = html;
  }

  // ---------- tabs ----------
  function switchView(view){
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
    $("view" + (view === "admin" ? "Admin" : "Public")).classList.add("active");
    $("tab" + (view === "admin" ? "Admin" : "Public")).classList.add("active");
  }
  $("tabPublic").addEventListener("click", () => switchView("public"));
  $("tabAdmin").addEventListener("click", () => switchView("admin"));

  // ---------- settings ----------
  $("saveTableName").addEventListener("click", async () => {
    const val = $("tableNameInput").value.trim();
    const authVal = $("authTableNameInput").value.trim();
    if(!val || !authVal) return;
    TABLE = val;
    AUTH_TABLE = authVal;
    try{ await window.storage.set("config:table_name", val); }catch(e){ /* ignore */ }
    try{ await window.storage.set("config:auth_table_name", authVal); }catch(e){ /* ignore */ }
    await checkAltColumn();
    await checkAuthorColumn();
    await loadEntries();
  });

  // ---------- init ----------
  (async function init(){
    switchView("public");
    showLoggedOut();
    await loadConfig();
    await checkAltColumn();
    await checkAuthorColumn();
    await loadEntries();
    await tryRestoreSession();
  })();
})();
</script>
</body>
</html>
