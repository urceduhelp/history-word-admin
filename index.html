<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>පරිපාලක පිටුව | විෂයානුබද්ධ වාග් මාලාව</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700;800&family=Noto+Serif+Sinhala:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest-900:#0f2e21;
    --forest-800:#163d2c;
    --forest-700:#1b4332;
    --forest-600:#2d6a4f;
    --forest-500:#3f8161;
    --mint-300:#95d5b2;
    --mint-200:#b7e4c7;
    --mint-100:#d9f2e4;
    --paper:#f4faf6;
    --paper-2:#ffffff;
    --ink:#12231a;
    --ink-soft:#3f5c4c;
    --danger:#b3492f;
    --danger-soft:#f4e2dd;
    --radius:14px;
    --shadow:0 10px 30px rgba(15,46,33,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 480px at 85% -10%, var(--mint-100) 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, var(--mint-100) 0%, transparent 55%),
      var(--paper);
    font-family:'Noto Sans Sinhala', sans-serif;
    color:var(--ink);
    min-height:100vh;
    -webkit-user-select:text;
  }
  h1,h2,h3,.brand{font-family:'Noto Serif Sinhala', serif;}

  header.topbar{
    background:linear-gradient(120deg, var(--forest-900), var(--forest-700) 65%, var(--forest-600));
    color:var(--mint-100);
    padding:22px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  header.topbar::after{
    content:"";
    position:absolute; right:-60px; top:-60px;
    width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle, rgba(149,213,178,0.25), transparent 70%);
    pointer-events:none;
  }
  .topbar-right{ position:relative; z-index:2; }
  .brand{font-size:1.5rem; font-weight:700; color:#fff; letter-spacing:.2px;}
  .brand small{display:block; font-family:'Noto Sans Sinhala',sans-serif; font-weight:400; font-size:.72rem; color:var(--mint-200); margin-top:2px;}
  .topbar-right{display:flex; align-items:center; gap:14px; font-size:.92rem;}
  .pill{background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); padding:6px 14px; border-radius:999px;}
  button.logout{
    background:transparent; border:1px solid var(--mint-300); color:var(--mint-200);
    padding:8px 18px; border-radius:999px; cursor:pointer; font-family:inherit; font-size:.88rem;
    transition:.2s;
  }
  button.logout:hover{background:var(--mint-300); color:var(--forest-900);}

  main{max-width:980px; margin:0 auto; padding:36px 20px 80px;}

  /* ---------- LOGIN ---------- */
  #loginWrap{
    max-width:420px; margin:8vh auto 0; background:var(--paper-2);
    border-radius:20px; padding:40px 34px; box-shadow:var(--shadow);
    border:1px solid var(--mint-200);
  }
  #loginWrap h2{margin:0 0 6px; color:var(--forest-800); font-size:1.55rem;}
  #loginWrap p.sub{margin:0 0 26px; color:var(--ink-soft); font-size:.92rem;}
  label{display:block; font-size:.85rem; color:var(--forest-700); font-weight:600; margin:0 0 6px;}
  input[type=text], input[type=password], textarea, select{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid #cfe6d7;
    background:var(--paper); font-family:inherit; font-size:.95rem; color:var(--ink);
    margin-bottom:18px; transition:.15s;
  }
  input:focus, textarea:focus, select:focus{
    outline:none; border-color:var(--forest-600); background:#fff;
    box-shadow:0 0 0 3px rgba(45,106,79,0.15);
  }
  textarea{resize:vertical; min-height:80px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--forest-700); color:#fff; border:none; padding:12px 22px;
    border-radius:10px; font-family:inherit; font-size:.95rem; font-weight:600;
    cursor:pointer; transition:.18s; width:100%;
  }
  .btn:hover{background:var(--forest-600); transform:translateY(-1px);}
  .btn.secondary{background:var(--mint-200); color:var(--forest-800); width:auto; padding:10px 18px;}
  .btn.secondary:hover{background:var(--mint-300);}
  .btn.danger{background:var(--danger); width:auto; padding:9px 16px; font-size:.85rem;}
  .btn.danger:hover{background:#96371f;}
  .btn.ghost{background:transparent; color:var(--forest-700); border:1.5px solid var(--forest-600); width:auto; padding:9px 16px; font-size:.85rem;}
  .btn.ghost:hover{background:var(--mint-100);}
  #loginError{color:var(--danger); font-size:.85rem; margin:-10px 0 16px; min-height:1em;}

  /* ---------- DASHBOARD ---------- */
  #dashboard{display:none;}
  .section-title{
    display:flex; align-items:baseline; justify-content:space-between; margin:38px 0 16px;
  }
  .section-title h2{font-size:1.25rem; color:var(--forest-800); margin:0;}
  .section-title span{font-size:.82rem; color:var(--ink-soft);}

  .card{
    background:var(--paper-2); border-radius:var(--radius); padding:26px 28px;
    box-shadow:var(--shadow); border:1px solid var(--mint-200);
  }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 20px;}
  @media (max-width:640px){.grid2{grid-template-columns:1fr;}}

  .entry{
    background:var(--paper-2); border:1px solid var(--mint-200); border-radius:12px;
    padding:18px 20px; margin-bottom:14px; position:relative;
    transition:.15s; border-left:5px solid var(--forest-600);
  }
  .entry.draft{border-left-color:#c99a2e;}
  .entry:hover{box-shadow:0 6px 18px rgba(15,46,33,0.1);}
  .entry-top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .entry-word{font-size:1.15rem; font-weight:700; color:var(--forest-800); font-family:'Noto Serif Sinhala',serif;}
  .status-tag{
    font-size:.72rem; padding:3px 11px; border-radius:999px; font-weight:600;
    background:var(--mint-200); color:var(--forest-800);
  }
  .status-tag.draft{background:#f7e9c6; color:#7a5c12;}
  .entry-meta{font-size:.82rem; color:var(--ink-soft); margin-top:6px; line-height:1.6;}
  .entry-meta b{color:var(--forest-700);}
  .entry-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .empty-state{
    text-align:center; padding:50px 20px; color:var(--ink-soft); font-size:.95rem;
    border:1.5px dashed var(--mint-300); border-radius:14px; background:var(--mint-100);
  }

  /* edit modal */
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(15,46,33,0.55);
    align-items:center; justify-content:center; z-index:200; padding:20px;
    backdrop-filter:blur(2px);
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--paper-2); border-radius:18px; padding:30px 32px; max-width:520px; width:100%;
    box-shadow:0 20px 60px rgba(15,46,33,0.3); max-height:88vh; overflow-y:auto;
  }
  .modal h3{margin:0 0 20px; color:var(--forest-800);}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:6px;}
  .checkbox-row{display:flex; align-items:center; gap:8px; margin:-6px 0 18px;}
  .checkbox-row input{width:auto; margin:0;}
  .checkbox-row label{margin:0; font-weight:500; color:var(--ink);}
  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--forest-800); color:#fff; padding:12px 22px; border-radius:10px;
    font-size:.9rem; box-shadow:var(--shadow); opacity:0; transition:.25s; z-index:300;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  footer{
    text-align:center; padding:26px 20px; color:var(--forest-700); font-size:.85rem;
    background:var(--mint-100); border-top:1px solid var(--mint-200);
  }
</style>
</head>
<body oncontextmenu="return false;">

<header class="topbar">
  <div class="brand">විෂයානුබද්ධ වාග් මාලාව<small>පරිපාලක පුවරුව — ඇතුළත් කිරීම් කළමනාකරණය</small></div>
  <div class="topbar-right" id="topRightSlot"></div>
</header>

<main>

  <div id="loginWrap">
    <h2>ගිණුමට පිවිසෙන්න</h2>
    <p class="sub">ඔබගේ පරිශීලක නාමය සහ මුරපදය ඇතුළත් කරන්න.</p>
    <label for="loginUser">Username</label>
    <input type="text" id="loginUser" autocomplete="username">
    <label for="loginPass">Password</label>
    <input type="password" id="loginPass" autocomplete="current-password">
    <div id="loginError"></div>
    <button class="btn" id="loginBtn">පිවිසෙන්න</button>
  </div>

  <div id="dashboard">

    <div class="card">
      <h2 style="margin-top:0; color:var(--forest-800); font-size:1.2rem;">නව වචනයක් ඇතුළත් කරන්න</h2>
      <div class="grid2">
        <div>
          <label>වචනය</label>
          <input type="text" id="fWord" placeholder="උදා: සංශ්ලේෂණය">
        </div>
        <div>
          <label>කැටගරිය</label>
          <input type="text" id="fCategory" placeholder="උදා: විද්‍යාව">
        </div>
      </div>
      <label>අර්ථ විස්තරය</label>
      <textarea id="fMeaning" placeholder="වචනයේ සම්පූර්ණ අර්ථ විස්තරය මෙහි ලියන්න"></textarea>
      <label>සාරාංශය</label>
      <textarea id="fSummary" placeholder="කෙටි සාරාංශයක්"></textarea>
      <label>මූලාශ්‍රය</label>
      <input type="text" id="fSource" placeholder="උදා: පෙළ පොත, පිටුව 45">
      <div class="checkbox-row">
        <input type="checkbox" id="fDraft">
        <label for="fDraft">Draft ලෙස සුරකින්න (පොදුවේ නොපෙන්වන්න)</label>
      </div>
      <button class="btn" id="addBtn" style="width:auto; padding:12px 28px;">එකතු කරන්න</button>
    </div>

    <div class="section-title">
      <h2>මා ඇතුළත් කළ දත්ත</h2>
      <span id="countLabel"></span>
    </div>
    <div id="entriesList"></div>

  </div>
</main>

<footer>කලාපීය ගුරු සහයෝගීතාව</footer>

<!-- Edit Modal -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <h3>ඇතුළත් කිරීම සංස්කරණය කරන්න</h3>
    <input type="hidden" id="editId">
    <label>වචනය</label>
    <input type="text" id="editWord">
    <label>කැටගරිය</label>
    <input type="text" id="editCategory">
    <label>අර්ථ විස්තරය</label>
    <textarea id="editMeaning"></textarea>
    <label>සාරාංශය</label>
    <textarea id="editSummary"></textarea>
    <label>මූලාශ්‍රය</label>
    <input type="text" id="editSource">
    <div class="modal-actions">
      <button class="btn ghost" id="cancelEdit">අවලංගු කරන්න</button>
      <button class="btn secondary" id="saveEdit" style="width:auto;">සුරකින්න</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---------------- CONFIG ----------------
const SUPABASE_URL = "https://uqgzlaxsnknheoerbfus.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxZ3psYXhzbmtuaGVvZXJiZnVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5MjM2MTUsImV4cCI6MjA3OTI4MzYxNX0.IYWZ7ukx8J-GJMWy7cMk2BWnmzJmJjjE93yEmJie7nQ";
const REST = `${SUPABASE_URL}/rest/v1`;
const HEADERS = {
  apikey: ANON_KEY,
  Authorization: `Bearer ${ANON_KEY}`,
  "Content-Type": "application/json"
};

// disable right click fully
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("keydown", e => {
  if (e.key === "F12") e.preventDefault();
});

let session = null;
try { session = JSON.parse(sessionStorage.getItem("wa_admin_session") || "null"); } catch(e){}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

function renderTopRight(){
  const slot = document.getElementById("topRightSlot");
  if (session){
    slot.innerHTML = `<span class="pill">${escapeHtml(session.username)}</span><button class="logout" id="logoutBtn">ඉවත් වන්න</button>`;
    document.getElementById("logoutBtn").onclick = logout;
  } else {
    slot.innerHTML = "";
  }
}

function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function logout(){
  sessionStorage.removeItem("wa_admin_session");
  session = null;
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("loginWrap").style.display = "block";
  renderTopRight();
}

async function login(){
  const username = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPass").value;
  const errEl = document.getElementById("loginError");
  errEl.textContent = "";
  if (!username || !password){
    errEl.textContent = "පරිශීලක නාමය සහ මුරපදය ඇතුළත් කරන්න.";
    return;
  }
  try {
    const res = await fetch(`${REST}/rpc/authenticate_author`, {
      method: "POST",
      headers: HEADERS,
      body: JSON.stringify({ p_username: username, p_password: password })
    });
    if (!res.ok) throw new Error("network");
    const rows = await res.json();
    if (!rows || rows.length === 0){
      errEl.textContent = "වැරදි පරිශීලක නාමයක් හෝ මුරපදයක්.";
      return;
    }
    session = { id: rows[0].id, username: rows[0].username };
    sessionStorage.setItem("wa_admin_session", JSON.stringify(session));
    document.getElementById("loginWrap").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    renderTopRight();
    loadEntries();
  } catch(e){
    errEl.textContent = "සම්බන්ධතාවයේ දෝෂයක්. නැවත උත්සාහ කරන්න.";
  }
}

async function loadEntries(){
  const list = document.getElementById("entriesList");
  list.innerHTML = `<div class="empty-state">පූරණය වෙමින්...</div>`;
  try {
    const res = await fetch(`${REST}/word_aliases?author_id=eq.${session.id}&select=*&order=created_at.desc`, { headers: HEADERS });
    const rows = await res.json();
    document.getElementById("countLabel").textContent = `සම්පූර්ණ: ${rows.length}`;
    if (rows.length === 0){
      list.innerHTML = `<div class="empty-state">ඔබ තවම කිසිදු වචනයක් ඇතුළත් කර නොමැත.</div>`;
      return;
    }
    list.innerHTML = rows.map(entryTemplate).join("");
    rows.forEach(r => {
      document.getElementById(`edit-${r.id}`).onclick = () => openEdit(r);
      document.getElementById(`del-${r.id}`).onclick = () => deleteEntry(r.id);
      document.getElementById(`draft-${r.id}`).onclick = () => toggleDraft(r);
    });
  } catch(e){
    list.innerHTML = `<div class="empty-state">දත්ත පූරණය කිරීමේදී දෝෂයක් ඇති විය.</div>`;
  }
}

function entryTemplate(r){
  const isDraft = r.status === "draft";
  const date = r.created_at ? new Date(r.created_at).toLocaleDateString("si-LK") : "";
  return `
  <div class="entry ${isDraft ? "draft" : ""}">
    <div class="entry-top">
      <div class="entry-word">${escapeHtml(r.word)}</div>
      <span class="status-tag ${isDraft ? "draft" : ""}">${isDraft ? "Draft" : "Published"}</span>
    </div>
    <div class="entry-meta">
      <div><b>අර්ථ විස්තරය:</b> ${escapeHtml(r.meaning || "-")}</div>
      <div><b>සාරාංශය:</b> ${escapeHtml(r.summary || "-")}</div>
      <div><b>කැටගරිය:</b> ${escapeHtml(r.category || "-")} &nbsp; | &nbsp; <b>මූලාශ්‍රය:</b> ${escapeHtml(r.source || "-")} &nbsp; | &nbsp; ${date}</div>
    </div>
    <div class="entry-actions">
      <button class="btn ghost" id="edit-${r.id}">සංස්කරණය</button>
      <button class="btn secondary" id="draft-${r.id}">${isDraft ? "Publish කරන්න" : "Draft කරන්න"}</button>
      <button class="btn danger" id="del-${r.id}">මකන්න</button>
    </div>
  </div>`;
}

async function addEntry(){
  const word = document.getElementById("fWord").value.trim();
  const meaning = document.getElementById("fMeaning").value.trim();
  const summary = document.getElementById("fSummary").value.trim();
  const category = document.getElementById("fCategory").value.trim();
  const source = document.getElementById("fSource").value.trim();
  const isDraft = document.getElementById("fDraft").checked;

  if (!word || !meaning){
    showToast("වචනය සහ අර්ථ විස්තරය අවශ්‍යයි.");
    return;
  }
  try {
    const res = await fetch(`${REST}/word_aliases`, {
      method: "POST",
      headers: { ...HEADERS, Prefer: "return=representation" },
      body: JSON.stringify({
        word, meaning, summary, category, source,
        author: session.username,
        author_id: session.id,
        status: isDraft ? "draft" : "published"
      })
    });
    if (!res.ok) throw new Error("insert failed");
    ["fWord","fMeaning","fSummary","fCategory","fSource"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("fDraft").checked = false;
    showToast("සාර්ථකව එකතු කරන ලදී.");
    loadEntries();
  } catch(e){
    showToast("එකතු කිරීමේදී දෝෂයක් ඇති විය.");
  }
}

function openEdit(r){
  document.getElementById("editId").value = r.id;
  document.getElementById("editWord").value = r.word || "";
  document.getElementById("editCategory").value = r.category || "";
  document.getElementById("editMeaning").value = r.meaning || "";
  document.getElementById("editSummary").value = r.summary || "";
  document.getElementById("editSource").value = r.source || "";
  document.getElementById("editOverlay").classList.add("show");
}

async function saveEdit(){
  const id = document.getElementById("editId").value;
  const payload = {
    word: document.getElementById("editWord").value.trim(),
    category: document.getElementById("editCategory").value.trim(),
    meaning: document.getElementById("editMeaning").value.trim(),
    summary: document.getElementById("editSummary").value.trim(),
    source: document.getElementById("editSource").value.trim(),
    updated_at: new Date().toISOString()
  };
  try {
    const res = await fetch(`${REST}/word_aliases?id=eq.${id}&author_id=eq.${session.id}`, {
      method: "PATCH",
      headers: HEADERS,
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("update failed");
    document.getElementById("editOverlay").classList.remove("show");
    showToast("සංස්කරණය සුරැකිණි.");
    loadEntries();
  } catch(e){
    showToast("සංස්කරණය අසාර්ථක විය.");
  }
}

async function deleteEntry(id){
  if (!confirm("මෙම ඇතුළත් කිරීම මකා දැමීමට අවශ්‍ය බව ඔබට විශ්වාසද?")) return;
  try {
    const res = await fetch(`${REST}/word_aliases?id=eq.${id}&author_id=eq.${session.id}`, {
      method: "DELETE",
      headers: HEADERS
    });
    if (!res.ok) throw new Error("delete failed");
    showToast("මකා දමන ලදී.");
    loadEntries();
  } catch(e){
    showToast("මකා දැමීම අසාර්ථක විය.");
  }
}

async function toggleDraft(r){
  const newStatus = r.status === "draft" ? "published" : "draft";
  try {
    const res = await fetch(`${REST}/word_aliases?id=eq.${r.id}&author_id=eq.${session.id}`, {
      method: "PATCH",
      headers: HEADERS,
      body: JSON.stringify({ status: newStatus, updated_at: new Date().toISOString() })
    });
    if (!res.ok) throw new Error("toggle failed");
    showToast(newStatus === "draft" ? "Draft තත්ත්වයට මාරු කරන ලදී." : "Publish කරන ලදී.");
    loadEntries();
  } catch(e){
    showToast("තත්ත්වය වෙනස් කිරීම අසාර්ථක විය.");
  }
}

document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("loginPass").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
document.getElementById("addBtn").addEventListener("click", addEntry);
document.getElementById("cancelEdit").addEventListener("click", () => document.getElementById("editOverlay").classList.remove("show"));
document.getElementById("saveEdit").addEventListener("click", saveEdit);

// init
renderTopRight();
if (session){
  document.getElementById("loginWrap").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  loadEntries();
}
</script>
</body>
</html>
